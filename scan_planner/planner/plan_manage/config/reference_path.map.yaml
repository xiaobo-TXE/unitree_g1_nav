reference_path_publisher:
  ros__parameters:
    frame_id: world
    publish_delay_sec: 0.5
    # Ground/route heights. The lift to body height comes from global_planner's
    # path_z_offset, so grid_map.body_height stays 0; raise these only if the
    # robot cannot climb the route.
    waypoints:
      [-5.5, 5.5, 0.10,
       -5.5, 4.5, 0.30,
       -5.5, 3.5, 0.40,
       -5.5, 2.5, 0.55,
       -5.5, 1.5, 0.70,
       -5.5, 0.5, 0.85,
       -5.5, -0.5, 1.00,
       -5.5, -1.5, 1.20,
       -5.5, -2.5, 1.40,
       -5.5, -3.5, 1.55,
       -5.5, -4.5, 1.55]
